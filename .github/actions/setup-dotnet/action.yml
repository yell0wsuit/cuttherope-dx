name: Set up .NET
description: Installs the .NET SDK and restores the NuGet package cache.

# Every job that restores NuGet packages goes through here, so the SDK version and the cache
# key are decided in one place.
#
# The key carries the job name because jobs restore different package sets (browser-wasm,
# the macOS workload, AOT compilers, ...). A key shared across jobs would give the second job
# an exact hit on a cache missing its own packages, and an exact hit is never re-saved, so it
# would download them on every run. The OS-only restore key still lets a new job, or one
# whose project files changed, start from whatever this OS already has.
#
# No packages.lock.json in this repo: versions are pinned centrally in Directory.Packages.props,
# so the project and props files decide what a restore produces.
#
# Pull requests only restore. A cache saved from a PR is scoped to that PR's merge ref, so no
# other PR or branch can ever read it, yet each one is several hundred MB against the
# repository's 10GB quota and pushes main's caches out. Main saves them instead, and every PR
# reads from there.
runs:
    using: composite
    steps:
        - uses: actions/setup-dotnet@v6
          with:
              dotnet-version: "10.x"

        - id: key
          shell: bash
          run: |
              echo "prefix=nuget-${{ runner.os }}-${{ github.job }}-" >> "$GITHUB_OUTPUT"
              echo "hash=${{ hashFiles('**/*.csproj', 'Directory.*.props', 'global.json', 'nuget.config') }}" >> "$GITHUB_OUTPUT"

        - if: github.event_name != 'pull_request'
          uses: actions/cache@v6
          with:
              path: ~/.nuget/packages
              key: ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.hash }}
              restore-keys: |
                  ${{ steps.key.outputs.prefix }}
                  nuget-${{ runner.os }}-

        - if: github.event_name == 'pull_request'
          uses: actions/cache/restore@v6
          with:
              path: ~/.nuget/packages
              key: ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.hash }}
              restore-keys: |
                  ${{ steps.key.outputs.prefix }}
                  nuget-${{ runner.os }}-
