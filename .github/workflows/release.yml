name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            version:
                description: "Version to build, e.g. 2.12.0.1"
                required: true
                type: string

permissions:
    contents: read

env:
    DOTNET_VERSION: "10.x"

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.resolve.outputs.version }}
        steps:
            # Tag pushes carry a leading "v" the scripts must not receive; dispatch runs
            # supply the bare version already.
            - id: resolve
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
                  else
                      echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
                  fi

    # The raw asset download is shared with the Pages deploy, so both agree on what "the
    # assets" are and neither re-implements the fetch. It runs once here to fill the cache
    # the three packaging jobs restore from; none of them needs it to have succeeded, since
    # the build fetches whatever is still missing.
    assets:
        uses: ./.github/workflows/content.yml

    windows:
        needs: [version, assets]
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - uses: actions/cache@v6
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.*.props', 'global.json') }}
                  restore-keys: nuget-${{ runner.os }}-

            # The publish deploys content straight from content/, and fetches anything
            # missing on its own. Restoring what the assets job already downloaded is
            # purely to skip that download; a miss costs time, not correctness.
            - name: Restore fetched assets
              uses: actions/cache/restore@v6
              with:
                  path: |
                      content/images
                      content/sounds
                      content/fonts
                      content/video_hd
                  key: ${{ needs.assets.outputs.cache-key }}

            - run: pip install py7zr tqdm
            - run: python distribution/release_windows.py "${{ needs.version.outputs.version }}"

            - uses: actions/upload-artifact@v7
              with:
                  name: bundle-windows
                  path: src/CutTheRopeDX.Desktop/bin/release_github/*.7z
                  compression-level: 0
                  retention-days: 7

    macos:
        needs: [version, assets]
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - uses: actions/cache@v6
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.*.props', 'global.json') }}
                  restore-keys: nuget-${{ runner.os }}-

            - name: Install macOS workload
              run: dotnet workload install macos

            # The publish deploys content straight from content/, and fetches anything
            # missing on its own. Restoring what the assets job already downloaded is
            # purely to skip that download; a miss costs time, not correctness.
            - name: Restore fetched assets
              uses: actions/cache/restore@v6
              with:
                  path: |
                      content/images
                      content/sounds
                      content/fonts
                      content/video_hd
                  key: ${{ needs.assets.outputs.cache-key }}

            # bundle_ffmpeg_macos.sh copies the dylibs out of Homebrew's ffmpeg. The major is
            # pinned because FFmpeg.AutoGen resolves functions by soname, so a runner that had
            # moved on to the next FFmpeg would ship a bundle with no working video decoder.
            - run: brew install ffmpeg@9

            - name: Build ffmpeg DMG
              env:
                  USE_AOT: "true"
              run: ./distribution/bundle_macos.sh "${{ needs.version.outputs.version }}"

            - name: Build AVFoundation DMG
              run: python3 distribution/release_macos_tahoe.py "${{ needs.version.outputs.version }}"

            - uses: actions/upload-artifact@v7
              with:
                  name: bundle-macos
                  path: src/CutTheRopeDX.Desktop/bin/release_github/*.dmg
                  compression-level: 0
                  retention-days: 7

    linux:
        needs: [version, assets]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - uses: actions/cache@v6
              with:
                  path: ~/.nuget/packages
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.*.props', 'global.json') }}
                  restore-keys: nuget-${{ runner.os }}-

            # The publish deploys content straight from content/, and fetches anything
            # missing on its own. Restoring what the assets job already downloaded is
            # purely to skip that download; a miss costs time, not correctness.
            - name: Restore fetched assets
              uses: actions/cache/restore@v6
              with:
                  path: |
                      content/images
                      content/sounds
                      content/fonts
                      content/video_hd
                  key: ${{ needs.assets.outputs.cache-key }}

            - run: ./distribution/build_appimage.sh "${{ needs.version.outputs.version }}"
            - run: ./distribution/build_deb.sh "${{ needs.version.outputs.version }}"

            - uses: actions/upload-artifact@v7
              with:
                  name: bundle-linux
                  path: |
                      src/CutTheRopeDX.Desktop/bin/release_github/*.AppImage
                      src/CutTheRopeDX.Desktop/bin/release_github/*.deb
                  compression-level: 0
                  retention-days: 7

    release:
        needs: [version, windows, macos, linux]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  pattern: bundle-*
                  path: artifacts
                  merge-multiple: true

            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: v${{ needs.version.outputs.version }}
                  name: v${{ needs.version.outputs.version }}
                  files: artifacts/*
                  generate_release_notes: true
