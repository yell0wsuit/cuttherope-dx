name: PR Code Quality

on:
    pull_request:
        branches: [main]
        paths:
            - "**/*.cs"
            - "**/*.csproj"
            - "**/*.props"
            - "**/*.targets"
            - "**/*.slnx"
            - "global.json"
            - "nuget.config"
            - ".github/workflows/pr-quality.yml"

permissions:
    contents: read

jobs:
    code-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@main

            - name: Setup .NET
              uses: actions/setup-dotnet@main
              with:
                  dotnet-version: "10.x"

            # The solution-wide build includes CutTheRopeDX.Browser, which targets
            # net10.0-browser and cannot restore or build without this workload.
            - name: Install WebAssembly workload
              run: dotnet workload install wasm-tools

            - name: Restore dependencies
              run: dotnet restore

            - name: Check formatting
              run: dotnet format --verify-no-changes --verbosity diagnostic

            - name: Build
              run: dotnet build --no-restore -c Release

            - name: Test
              run: dotnet test --solution CutTheRopeDX.slnx --no-build -c Release
