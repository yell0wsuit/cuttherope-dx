name: Fetch Content

# Reusable: fetches the raw asset tree into content/ and leaves it in the Actions cache.
# Both the release and the Pages deploy start from these assets — the desktop ships the PNGs
# and WAVs as they are, Pages converts them for the browser with scripts/build_web_content.py
# — so the download itself lives here rather than in each.
#
# The assets are ~336MB, far past what is sensible to pass around as an artifact on every run,
# so callers restore the cache this job populates instead. The key is returned as an output so
# only this file decides what invalidates it.
on:
    workflow_call:
        outputs:
            cache-key:
                description: "Key of the cache holding the fetched content/ tree."
                value: ${{ jobs.fetch.outputs.cache-key }}

permissions:
    contents: read

env:
    DOTNET_VERSION: "10.x"

jobs:
    fetch:
        runs-on: ubuntu-latest
        outputs:
            cache-key: ${{ steps.key.outputs.value }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            # The manifest names every asset and its hash, so it alone decides what a fetch
            # would produce; the fetch code is included so a change in how assets are laid
            # down also invalidates.
            - name: Compute cache key
              id: key
              run: |
                  echo "value=raw-content-${{ hashFiles('content/file_manifest.json', 'content/Builder/Assets/**/*.cs', 'content/Builder/Commands/**/*.cs') }}" >> "$GITHUB_OUTPUT"

            - uses: actions/cache@v6
              id: cache
              with:
                  path: |
                      content/images
                      content/sounds
                      content/fonts
                      content/video_hd
                  key: ${{ steps.key.outputs.value }}

            - name: Fetch and verify assets
              run: |
                  BUILDER=content/Builder/bin/Debug/CutTheRopeDX.Content.dll
                  dotnet build content/Builder/CutTheRopeDX.Content.csproj
                  dotnet "$BUILDER" fetch -s content
                  dotnet "$BUILDER" verify -s content

            # The headless tests read the checked-in copy of this manifest rather than
            # measuring the images, so a resized or added PNG would leave them sizing sprites
            # from stale numbers. Every job that needs the images starts here, so this is the
            # one place that can see them.
            - name: Check the checked-in image dimensions are current
              run: |
                  BUILDER=content/Builder/bin/Debug/CutTheRopeDX.Content.dll
                  dotnet "$BUILDER" build -s content -o "$RUNNER_TEMP/content-check"
                  python3 - <<'PY'
                  import json, os, sys
                  built = json.load(open(
                      os.path.join(os.environ["RUNNER_TEMP"],
                                   "content-check/images/image_dimensions.json")))
                  tracked = json.load(open("content/images/image_dimensions.json"))
                  if built != tracked:
                      names = set(built["images"]) ^ set(tracked["images"])
                      resized = {k for k in set(built["images"]) & set(tracked["images"])
                                 if built["images"][k] != tracked["images"][k]}
                      sys.exit("content/images/image_dimensions.json is stale. "
                               f"Added/removed: {sorted(names)}. Resized: {sorted(resized)}. "
                               "Copy the built manifest over it and commit.")
                  PY
