name: Bug report
description: Report a bug or incorrect behavior in Cut the Rope DX
labels: ["bug"]
body:
    - type: checkboxes
      attributes:
          label: Required agreements
          description: Please confirm the following before submitting your issue. Issues that do not meet these requirements may be closed.
          options:
              - label: I confirm that I have searched the existing issue(s)
                required: true
              - label: I confirm that I have read the FAQ - https://github.com/yell0wsuit/cuttherope-dx/wiki/Frequently-Asked-Questions
                required: true
              - label: I understand that repeatedly submitting duplicate issues may result in being blocked from the repository.
                required: true
    - type: input
      id: version
      attributes:
          label: Cut the Rope DX version
          description: The version of Cut the Rope DX you are using. It is found in the title bar.
      validations:
          required: true
    - type: textarea
      id: description
      attributes:
          label: Description
          description: Describe the bug.
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
          description: A concise description of what you expected to happen.
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Reproduction steps
          description: Steps to reproduce the behavior.
          placeholder: |
              1. Open this...
              1. Do this...
              1. See error...
      validations:
          required: true
    - type: upload
      id: logs
      attributes:
          label: Log file
          description: |
              Strongly recommended: without a log, most bugs cannot be investigated. Upload the log from the session where the bug happened. Each launch writes its own file, named `ctrdx-<date>-<time>.log`, in the `logs` folder inside `CutTheRopeDX_SaveData`:

              - **Windows:** next to the game's executable, e.g. `CutTheRopeDX_SaveData/logs`
              - **macOS, Linux AppImage/.deb, or a folder the game cannot write to:** `Documents/CutTheRopeDX_SaveData/logs` in your home folder

              For several logs, zip them.
      validations:
          required: false
          accept: ".log,.zip"
    - type: upload
      id: media
      attributes:
          label: Screenshots or videos
          description: Optional, but they help a lot for visual bugs.
      validations:
          required: false
          accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
    - type: dropdown
      id: os
      attributes:
          label: Operating system
          description: Which operating system are you using?
          options:
              - Windows
              - Linux
              - macOS
      validations:
          required: true
    - type: input
      id: cpuspec
      attributes:
          label: CPU spec
          description: Optional; the log already records it. What type of CPU are you using? (Intel i9-14900, etc.)
      validations:
          required: false
    - type: input
      id: gpuspec
      attributes:
          label: GPU spec
          description: What GPU vendor are you using? (NVIDIA, Intel Arc, AMD, integrated GPU, etc.)
      validations:
          required: true
    - type: input
      attributes:
          label: RAM spec
          description: Optional; the log already records it. How much RAM do you have? (e.g. 8GB of RAM)
      validations:
          required: false
    - type: textarea
      attributes:
          label: Additional info
          description: Any extra info or stack traces go here.
          placeholder: |
              Paste any error messages or useful notes here...
      validations:
          required: false
